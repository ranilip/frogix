<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/base.css?v=note2">
  <link rel="stylesheet" href="/modal.css?v=note2">
  <link rel="stylesheet" href="/forms.css?v=note2">
  <script src="/theme.js"></script>
</head>
<body class="modal-page">
  <main class="modal-backdrop">
    <section class="modal-panel modal-panel-sm" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <header class="modal-header">
        <div>
          <h1 id="login-title">Login</h1>
          <p class="note">Enter admin password to open device settings.</p>
        </div>
        <a href="/" class="modal-close" aria-label="Close" onclick="return closeModalPage(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </a>
      </header>
      <div class="modal-content">
      <form method="POST" action="/api/login" class="auth-form" novalidate>
        <label>
          Password
          <div class="pw-wrap">
            <input type="password" name="password" id="pw" autocomplete="current-password" autofocus>
            <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePassword(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </label>
        <button type="submit">Log in</button>
        <p class="form-status" id="status-login" aria-live="polite"></p>
      </form>
      </div>
    </section>
  </main>
  <script src="/auth-common.js"></script>
  <script>
    document.querySelector('.auth-form').addEventListener('submit', event => {
      event.preventDefault();
      submitAuthForm(
        event.target,
        document.getElementById('status-login'),
        '/setup',
        f => f.querySelector('[name=password]').value ? null : 'Password is required'
      );
    });
  </script>
</body>
</html>
