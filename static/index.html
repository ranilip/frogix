<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frogix</title>
  <link rel="stylesheet" href="/base.css?v=note2">
  <link rel="stylesheet" href="/dashboard.css?v=note2">
  <script src="/theme.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="2 4 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M10.17,6.92 A2.3,2.3 0 0,0 6.31,9.18 A7.8,7.8 0 1,0 17.69,9.18 A2.3,2.3 0 0,0 13.83,6.92 A7.8,7.8 0 0,0 10.17,6.92 Z"/>
          <circle cx="8.5" cy="6.9" r="0.65" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="6.9" r="0.65" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Frogix</div>
        <div class="note">Real-time Monitoring</div>
      </div>
    </div>
    <div class="header-right">
      <span id="clock" class="clock">--:--:--</span>
      <a href="/setup" class="settings-btn" id="open-settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <div id="metric-cards"></div>
  </main>

  <footer class="sysinfo">
    <div class="sysinfo-item"><span class="si-label">Version</span><span class="si-val" id="version">--</span></div>
    <div class="sysinfo-item"><span class="si-label">Uptime</span><span class="si-val" id="uptime">--</span></div>
    <div class="sysinfo-item"><span class="si-label">Wi-Fi</span><span class="si-val" id="wifi_status">--</span></div>
    <div class="sysinfo-item"><span class="si-label">MQTT</span><span class="si-val" id="mqtt_status">--</span></div>
    <div class="sysinfo-item"><span class="si-label">AP IP</span><span class="si-val" id="ap_ip">--</span></div>
    <div class="sysinfo-item"><span class="si-label">STA IP</span><span class="si-val" id="sta_ip">--</span></div>
  </footer>

  <div class="settings-modal" id="settings-modal" aria-hidden="true">
    <iframe id="settings-frame" title="Settings"></iframe>
  </div>

  <script src="/index.js"></script>
</body>
</html>
